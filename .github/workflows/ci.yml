name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Show compiler version
        run: gcc --version

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Run sanitizer tests
        run: make test-asan